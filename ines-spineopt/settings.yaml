default_parameters:
  unit:
    investment_variable_type: linear
  connection:
    investment_variable_type: linear
  model:
    discount_rate: 0.05
    # use_economic_representation: True

map_of_periods_or_historical_to_ts:
  unit:
    unit:
      availability: [availability_factor, 1.0,[[1]]]
      units_fix_cumulative: [investment_count_fix_cumulative, 1.0, [[1]]]
      units_max_cumulative: [investment_count_max_cumulative, 1.0, [[1]]]
  unit__to_node:
    unit:
      profile_limit_upper: [availability_factor, 1.0,[[1]]]
      investment_cost: [unit_investment_cost, 1.0, [[1]]]
      fixed_cost: 
        target: [fom_cost, 1.0,[[1]]]
        operation: divide
        with: 8760.0
    unit__to_node:
      other_operational_cost: [vom_cost, 1.0,[[1],[2]]]
      profile_fix:  
        target: [flow_limits_fix, 1.0,[[1],[2]]]
        operation: multiply
        with: capacity
  node__to_unit:
    unit:
      fixed_cost: 
        target: [fom_cost, 1.0,[[2]]]
        operation: divide
        with: 8760.0
    node__to_unit:
        other_operational_cost: [vom_cost, 1.0,[[1],[2]]]
  link: 
    connection:
      investment_cost: [connection_investment_cost,1.0,[[1]]]
      links_max_cumulative: [investment_count_max_cumulative,1.0,[[1]]]
      availability: [availability_factor,1.0,[[1]]]
  node__link__node: 
    connection__from_node:
      operational_cost: [connection_flow_cost, 1.0,[[2],[1]]]
      capacity: [capacity_per_connection,1.0,[[2], [1]]]
    connection__node__node:
      efficiency: [fix_ratio_out_in_connection_flow,1.0,[[2], [3], [1]]]
  node:
    node:
      flow_annual: [demand_fraction,1.0,[[1]]]
      storage_state_lower_limit: [storage_state_min_fraction, 1.0,[[1]]]
      storage_state_upper_limit: [storage_state_max_fraction, 1.0,[[1]]]
      storages_fix_cumulative: [storage_investment_count_fix_cumulative,1.0,[[1]]]
      storages_max_cumulative: [storage_investment_count_max_cumulative,1.0,[[1]]]
      storage_investment_cost: [storage_investment_cost,1.0,[[1]]]
      storage_fixed_cost: 
        target: [storage_fixed_annual_cost, 1.0,[[1]]]
        operation: divide
        with: 8760
      commodity_price: [tax_out_unit_flow,1.0,[[1]]]
      
lifetime_to_duration:
  unit:
    unit: 
      lifetime: 
        - lifetime_economic
        - lifetime_technical
  link:
    connection:
      lifetime:
        - lifetime_economic
        - lifetime_technical
  node:
    node:
      storage_lifetime: 
        - storage_lifetime_economic
        - storage_lifetime_technical
    